- name: Installer keepalived
  apt:
    name: keepalived
    state: present

- name: Déployer la configuration
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: '0644'
  notify: restart keepalived

- name: Activer le service
  systemd:
    name: keepalived
    enabled: yes
    state: started
